name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./edge[dev]
          pip install -e ./server[dev]
          pip check

      - name: Lint
        run: ruff check edge server tests scripts

      - name: Edge tests
        run: PYTHONPATH=edge/src:server/src pytest -q edge/tests

      - name: Server tests
        run: PYTHONPATH=edge/src:server/src pytest -q server/tests

      - name: Wire contract
        run: PYTHONPATH=edge/src:server/src pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:mock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose configuration
        run: docker compose -f server/docker-compose.yml config --quiet

      - name: Build server image
        run: docker build --tag beaconwatch-server:ci ./server
