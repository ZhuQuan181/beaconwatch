name: rid-server

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: rid-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: rid
      POSTGRES_USER: rid
      POSTGRES_PASSWORD: rid_dev_password
    ports:
      - "5433:5432"
    volumes:
      - rid_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rid -d rid"]
      interval: 5s
      timeout: 5s
      retries: 20

  emqx:
    image: emqx/emqx:5.7.0
    container_name: rid-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 0.0.0.0
      EMQX_LISTENER__TCP__EXTERNAL: "1883"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"   # MQTT
      - "18083:18083" # Dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rid-server:
    build: .
    container_name: rid-server
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      RID_DB_HOST: timescaledb
      RID_DB_PORT: 5432
      RID_DB_NAME: rid
      RID_DB_USER: rid
      RID_DB_PASSWORD: rid_dev_password
      RID_MQTT_HOST: emqx
      RID_MQTT_PORT: 1883
      RID_MQTT_OBS_TOPIC: rid/v1/+/obs
      RID_MQTT_INFO_TOPIC: rid/v1/+/info
      RID_MQTT_TLS: ${RID_MQTT_TLS:-false}
      RID_MQTT_CA_CERT: ${RID_MQTT_CA_CERT:-}
      RID_MQTT_CLIENT_CERT: ${RID_MQTT_CLIENT_CERT:-}
      RID_MQTT_CLIENT_KEY: ${RID_MQTT_CLIENT_KEY:-}
      RID_API_TOKEN: ${RID_API_TOKEN:-}
      RID_AUTH_USERS_FILE: ${RID_AUTH_USERS_FILE:-}
      RID_AUTH_RELOAD_INTERVAL_S: ${RID_AUTH_RELOAD_INTERVAL_S:-5}
      RID_CORS_ORIGINS: ${RID_CORS_ORIGINS:-}
      RID_WS_PING_INTERVAL_S: ${RID_WS_PING_INTERVAL_S:-20}
      RID_UNIDENTIFIED_LOOKBACK_S: ${RID_UNIDENTIFIED_LOOKBACK_S:-604800}
      RID_NOTIFY_WEBHOOK_URL: ${RID_NOTIFY_WEBHOOK_URL:-}
      RID_NOTIFY_WEBHOOK_SECRET: ${RID_NOTIFY_WEBHOOK_SECRET:-}
      RID_NOTIFY_WEBHOOK_TIMEOUT_S: ${RID_NOTIFY_WEBHOOK_TIMEOUT_S:-10}
      RID_NOTIFY_WEBHOOK_TRUST_ENV: ${RID_NOTIFY_WEBHOOK_TRUST_ENV:-false}
      RID_NOTIFY_WORKER_INTERVAL_S: ${RID_NOTIFY_WORKER_INTERVAL_S:-1}
      RID_NOTIFY_BATCH_SIZE: ${RID_NOTIFY_BATCH_SIZE:-20}
      RID_NOTIFY_CONCURRENCY: ${RID_NOTIFY_CONCURRENCY:-4}
      RID_NOTIFY_MAX_ATTEMPTS: ${RID_NOTIFY_MAX_ATTEMPTS:-8}
      RID_NOTIFY_BASE_BACKOFF_S: ${RID_NOTIFY_BASE_BACKOFF_S:-2}
      RID_NOTIFY_MAX_BACKOFF_S: ${RID_NOTIFY_MAX_BACKOFF_S:-300}
      RID_ALERT_RETENTION_DAYS: ${RID_ALERT_RETENTION_DAYS:-0}
      RID_NOTIFICATION_RETENTION_DAYS: ${RID_NOTIFICATION_RETENTION_DAYS:-0}
      RID_RETENTION_INTERVAL_S: ${RID_RETENTION_INTERVAL_S:-3600}
      RID_RETENTION_BATCH_SIZE: ${RID_RETENTION_BATCH_SIZE:-500}
      RID_HTTP_HOST: 0.0.0.0
      RID_HTTP_PORT: 8000
    ports:
      - "8000:8000"
    command: ["uvicorn", "rid_server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rid_pgdata: {}
