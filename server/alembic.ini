# Alembic configuration for the RID server.
# The actual migration is in alembic/versions/.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://rid:rid_dev_password@localhost:5433/rid

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
