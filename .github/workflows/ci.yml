name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RID_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./edge[dev]
          pip install -e ./server[dev]
          pip check

      - name: Lint
        run: ruff check edge server tests scripts

      - name: Operational script smoke tests
        run: |
          PYTHONPATH=edge/src:server/src python scripts/load_test.py --help >/dev/null
          PYTHONPATH=edge/src:server/src python scripts/e2e_resilience.py --help >/dev/null

      - name: Edge tests
        run: PYTHONPATH=edge/src:server/src pytest -q edge/tests

      - name: Server tests
        run: PYTHONPATH=edge/src:server/src pytest -q server/tests

      - name: Wire contract
        run: PYTHONPATH=edge/src:server/src pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:mock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose configuration
        run: |
          docker compose -f server/docker-compose.yml config --quiet
          docker compose -p bwresilience \
            -f server/docker-compose.yml \
            -f deploy/testing/compose.resilience.yml config --quiet
          docker compose --env-file deploy/production/.env.example \
            -f deploy/production/compose.yaml config --quiet
          sh -n deploy/production/docker-entrypoint.d/40-beaconwatch-config.sh

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            check rules /rules/prometheus-rules.yml

      - name: Build server image
        run: docker build --tag beaconwatch-server:ci ./server

      - name: Build reverse-proxy image
        run: |
          docker build --tag beaconwatch-proxy:ci \
            -f deploy/production/Dockerfile.proxy .

      - name: Validate Nginx configuration
        run: |
          mkdir -p /tmp/beaconwatch-certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/beaconwatch-certs/privkey.pem \
            -out /tmp/beaconwatch-certs/fullchain.pem \
            -subj /CN=localhost
          docker run --rm --entrypoint nginx \
            -v /tmp/beaconwatch-certs:/etc/nginx/certs:ro \
            beaconwatch-proxy:ci -t
