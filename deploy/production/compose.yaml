name: beaconwatch-prod

x-api-base: &api-base
  image: ${BW_SERVER_IMAGE:-beaconwatch-server:1.0.0}
  build:
    context: ../../server
  restart: unless-stopped
  environment: &api-environment
    RID_ENV: production
    RID_HTTP_HOST: 0.0.0.0
    RID_HTTP_PORT: "8000"
    RID_DB_HOST: db
    RID_DB_PORT: "5432"
    RID_DB_NAME: ${BW_DB_NAME:-beaconwatch}
    RID_DB_USER: ${BW_DB_USER:-beaconwatch}
    RID_DB_PASSWORD_FILE: /run/secrets/db_password
    RID_DB_POOL_MIN: "4"
    RID_DB_POOL_MAX: "20"
    RID_MIGRATION_MAX_ATTEMPTS: "30"
    RID_MIGRATION_RETRY_BASE_S: "1"
    RID_MIGRATION_RETRY_MAX_S: "10"
    RID_MQTT_HOST: mqtt
    RID_MQTT_PORT: "1883"
    RID_MQTT_OBS_TOPIC: rid/v1/+/obs
    RID_MQTT_INFO_TOPIC: rid/v1/+/info
    RID_MQTT_SHARED_GROUP: ${BW_MQTT_SHARED_GROUP:-beaconwatch-prod}
    RID_MQTT_QOS: "1"
    RID_INSTANCE_ID: ""
    RID_BUS_BACKEND: redis
    RID_REDIS_URL_FILE: /run/secrets/redis_url
    RID_REDIS_CHANNEL: beaconwatch:events
    RID_REDIS_REQUIRED: "true"
    RID_REDIS_CONNECT_TIMEOUT_S: "3"
    RID_REDIS_PUBLISH_TIMEOUT_S: "1"
    RID_REDIS_POLL_TIMEOUT_S: "1"
    RID_REDIS_RECONNECT_MAX_S: "30"
    RID_AUTH_USERS_FILE: /run/secrets/auth_users
    RID_AUTH_RELOAD_INTERVAL_S: "5"
    RID_CORS_ORIGINS: ""
    RID_WS_PING_INTERVAL_S: "20"
    RID_UNIDENTIFIED_LOOKBACK_S: "604800"
    RID_ALERT_MAX_ALT_M: "120"
    RID_ALERT_UNIDENTIFIED: "true"
    RID_ALERT_DEDUP_SECONDS: "120"
    RID_ALERT_RETENTION_DAYS: ${RID_ALERT_RETENTION_DAYS:-365}
    RID_NOTIFICATION_RETENTION_DAYS: ${RID_NOTIFICATION_RETENTION_DAYS:-90}
    RID_RETENTION_INTERVAL_S: ${RID_RETENTION_INTERVAL_S:-3600}
    RID_RETENTION_BATCH_SIZE: ${RID_RETENTION_BATCH_SIZE:-500}
    RID_NOTIFY_WEBHOOK_URL: ${RID_NOTIFY_WEBHOOK_URL:-}
    RID_NOTIFY_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    RID_NOTIFY_WEBHOOK_TIMEOUT_S: "10"
    RID_NOTIFY_WEBHOOK_TRUST_ENV: "false"
    RID_NOTIFY_WORKER_INTERVAL_S: "1"
    RID_NOTIFY_BATCH_SIZE: "20"
    RID_NOTIFY_CONCURRENCY: "4"
    RID_NOTIFY_MAX_ATTEMPTS: ${RID_NOTIFY_MAX_ATTEMPTS:-8}
    RID_NOTIFY_BASE_BACKOFF_S: ${RID_NOTIFY_BASE_BACKOFF_S:-2}
    RID_NOTIFY_MAX_BACKOFF_S: ${RID_NOTIFY_MAX_BACKOFF_S:-300}
    RID_LOG_LEVEL: ${RID_LOG_LEVEL:-INFO}
  secrets:
    - db_password
    - redis_url
    - auth_users
    - webhook_secret
  networks:
    - backend
    - frontend
  logging:
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${BW_DB_NAME:-beaconwatch}
      POSTGRES_USER: ${BW_DB_USER:-beaconwatch}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  mqtt:
    image: emqx/emqx:5.7.0
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__ENABLED: "false"
      EMQX_LISTENER__TCP__EXTERNAL: "1883"
    ports:
      - "${BW_MQTT_BIND_IP:-127.0.0.1}:${BW_MQTT_PUBLISH_PORT:-1883}:1883"
    volumes:
      - mqtt_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server --save "" --appendonly no
        --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  migrate:
    <<: *api-base
    restart: "no"
    command: ["true"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-base
    command:
      [
        "uvicorn",
        "rid_server.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    environment:
      <<: *api-environment
      RID_SKIP_MIGRATIONS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: ${BW_API_REPLICAS:-2}

  proxy:
    image: ${BW_PROXY_IMAGE:-beaconwatch-proxy:1.0.0}
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${BW_HTTP_PORT:-80}:8080"
      - "${BW_HTTPS_PORT:-443}:8443"
    secrets:
      - viewer_api_token
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz | grep -q ok",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend
    logging:
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db_data: {}
  mqtt_data: {}

secrets:
  db_password:
    file: ${BW_DB_PASSWORD_FILE:-./secrets/db_password}
  redis_password:
    file: ${BW_REDIS_PASSWORD_FILE:-./secrets/redis_password}
  redis_url:
    file: ${BW_REDIS_URL_FILE:-./secrets/redis_url}
  auth_users:
    file: ${BW_AUTH_USERS_FILE:-./secrets/auth_users.json}
  webhook_secret:
    file: ${BW_WEBHOOK_SECRET_FILE:-./secrets/webhook_secret}
  viewer_api_token:
    file: ${BW_VIEWER_API_TOKEN_FILE:-./secrets/viewer_api_token}
