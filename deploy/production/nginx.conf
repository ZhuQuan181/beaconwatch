user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;

    server {
        listen 8080 default_server;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        http2 on;
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        root /usr/share/nginx/html;
        index index.html;

        location = /config.js {
            expires -1;
            try_files $uri =404;
        }

        location = /healthz {
            access_log off;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            limit_req zone=api_rate burst=60 nodelay;
            rewrite ^/api/?(.*)$ /$1 break;
            set $api_upstream http://api:8000;
            proxy_http_version 1.1;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location /ws/ {
            set $api_upstream http://api:8000;
            proxy_http_version 1.1;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location = / {
            expires -1;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 1h;
            try_files $uri =404;
        }
    }
}
